{% extends 'dance/base.html' %}

{% block title %}发布帖子 - 交流社区{% endblock %}

{% block content %}
<style>
    .create-post-page {
        max-width: 800px;
        margin: 0 auto;
        padding: 3rem 2rem 2rem;
        min-height: calc(100vh - 80px);
    }
    
    /* 顶部区域 */
    .post-top {
        margin-bottom: 2rem;
    }
    
    /* 图片上传区 */
    .image-upload-area {
        display: flex;
        gap: 0.8rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
    }
    
    .image-preview {
        width: 100px;
        height: 100px;
        border-radius: 0.6rem;
        overflow: hidden;
        position: relative;
        background: rgba(20, 22, 30, 0.6);
    }
    
    .image-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .image-add-btn {
        width: 100px;
        height: 100px;
        border-radius: 0.6rem;
        background: rgba(20, 22, 30, 0.4);
        border: 2px dashed rgba(216, 191, 100, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
    }
    
    .image-add-btn:hover {
        background: rgba(20, 22, 30, 0.6);
        border-color: rgba(216, 191, 100, 0.4);
    }
    
    .image-add-btn i {
        font-size: 2rem;
        color: rgba(216, 191, 100, 0.4);
    }
    
    .image-add-btn input[type="file"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
    }
    
    /* 标题输入 */
    .title-input {
        width: 100%;
        padding: 0.8rem 0;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(216, 191, 100, 0.15);
        color: #F5EDC8;
        font-family: 'Noto Serif SC', serif;
        font-size: 1.5rem;
        font-weight: 600;
        outline: none;
        transition: all 0.3s;
        margin-bottom: 1rem;
    }
    
    .title-input::placeholder {
        color: rgba(232, 213, 155, 0.3);
    }
    
    .title-input:focus {
        border-bottom-color: rgba(216, 191, 100, 0.4);
    }
    
    /* 正文输入 */
    .content-input {
        width: 100%;
        padding: 0.8rem 0;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(216, 191, 100, 0.1);
        color: rgba(232, 213, 155, 0.7);
        font-family: 'Noto Serif SC', serif;
        font-size: 1rem;
        line-height: 1.8;
        outline: none;
        resize: none;
        transition: all 0.3s;
        min-height: 200px;
        margin-bottom: 1.5rem;
    }
    
    .content-input::placeholder {
        color: rgba(232, 213, 155, 0.25);
    }
    
    .content-input:focus {
        border-bottom-color: rgba(216, 191, 100, 0.3);
    }
    
    /* 选项区 */
    .options-section {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(216, 191, 100, 0.1);
    }
    
    .option-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 0;
        border-bottom: 1px solid rgba(216, 191, 100, 0.1);
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .option-item:hover {
        background: rgba(20, 22, 30, 0.3);
        padding-left: 0.5rem;
        margin: 0 -0.5rem;
        border-radius: 0.4rem;
    }
    
    .option-left {
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }
    
    .option-icon {
        width: 44px;
        height: 44px;
        border-radius: 0.8rem;
        background: rgba(216, 191, 100, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #D8BF64;
        font-size: 1.2rem;
    }
    
    .option-text {
        color: #D8BF64;
        font-size: 1.05rem;
        font-weight: 500;
    }
    
    .option-arrow {
        color: #D8BF64;
        font-size: 1rem;
        transition: transform 0.3s;
    }
    
    /* 话题标签区 */
    .tags-section {
        margin: 1.5rem 0;
    }
    
    .tags-row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
    }
    
    .tag-pill {
        padding: 0.5rem 1rem;
        background: rgba(216, 191, 100, 0.08);
        border: none;
        border-radius: 1.5rem;
        color: rgba(232, 213, 155, 0.6);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .tag-pill:hover {
        background: rgba(216, 191, 100, 0.15);
        color: #E8D59B;
    }
    
    .tag-pill.active {
        background: rgba(216, 191, 100, 0.2);
        color: #E8D59B;
    }
    
    .tag-input-row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
    }
    
    .tag-input {
        flex: 1;
        padding: 0.5rem 1rem;
        background: rgba(20, 22, 30, 0.4);
        border: none;
        border-radius: 1.5rem;
        color: #F5EDC8;
        font-size: 0.85rem;
        outline: none;
        transition: all 0.3s;
    }
    
    .tag-input::placeholder {
        color: rgba(232, 213, 155, 0.3);
    }
    
    .tag-input:focus {
        background: rgba(20, 22, 30, 0.6);
    }
    
    .add-tag-btn {
        padding: 0.5rem 1rem;
        background: rgba(216, 191, 100, 0.1);
        border: none;
        border-radius: 1.5rem;
        color: rgba(216, 191, 100, 0.7);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .add-tag-btn:hover {
        background: rgba(216, 191, 100, 0.2);
    }
    
    /* 底部操作区 */
    .bottom-actions {
        position: sticky;
        bottom: 0;
        padding: 1.5rem 0;
        background: linear-gradient(to top, rgba(15, 15, 26, 0.95) 70%, transparent);
        margin-top: 2rem;
        display: flex;
        gap: 1rem;
        justify-content: center;
        align-items: center;
    }
    
    .btn-drafts-link {
        position: absolute;
        left: 2rem;
        color: rgba(232, 213, 155, 0.6) !important;
        font-size: 0.95rem;
        text-decoration: none !important;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s;
        font-family: 'Noto Serif SC', serif;
    }
    
    .btn-drafts-link:hover {
        color: #E8D59B !important;
        text-decoration: none !important;
    }
    
    .btn-draft {
        padding: 0.8rem 2rem;
        background: transparent;
        border: 1px solid rgba(216, 191, 100, 0.2);
        border-radius: 2rem;
        color: rgba(232, 213, 155, 0.6);
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.3s;
        font-family: 'Noto Serif SC', serif;
    }
    
    .btn-draft:hover {
        border-color: rgba(216, 191, 100, 0.4);
        color: #E8D59B;
    }
    
    .btn-publish {
        padding: 0.8rem 3rem;
        background: linear-gradient(135deg, #D8BF64, #E8D59B);
        border: none;
        border-radius: 2rem;
        color: #0F0F1A;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: 'Noto Serif SC', serif;
        letter-spacing: 1px;
    }
    
    .btn-publish:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(216, 191, 100, 0.4);
    }
    
    .btn-back {
        position: fixed;
        top: 100px;
        left: 2rem;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(20, 22, 30, 0.9);
        border: 1px solid rgba(216, 191, 100, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #D8BF64;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        z-index: 1001;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    
    .btn-back:hover {
        background: rgba(20, 22, 30, 0.8);
        color: #E8D59B;
    }
    
    @media (max-width: 768px) {
        .create-post-page {
            padding: 1rem;
        }
        
        .image-preview,
        .image-add-btn {
            width: 80px;
            height: 80px;
        }
        
        .btn-publish {
            padding: 0.8rem 2rem;
        }
    }
</style>

<div class="create-post-page">
    <a href="{% url 'community_posts' %}" class="btn-back">
        <i class="fas fa-arrow-left"></i>
    </a>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- 图片上传区 -->
        <div class="image-upload-area">
            <div id="imagePreviewContainer"></div>
            <div class="image-add-btn">
                <i class="fas fa-plus"></i>
                <input type="file" id="cover_image" name="cover_image" accept="image/*">
            </div>
        </div>
        
        <!-- 标题输入 -->
        <input type="text" class="title-input" id="title" name="title" placeholder="添加标题" required value="{% if editing_post %}{{ editing_post.title }}{% endif %}">
        
        <!-- 正文输入 -->
        <textarea class="content-input" id="content" name="content" placeholder="添加正文..." required>{% if editing_post %}{{ editing_post.content }}{% endif %}</textarea>
        
        <!-- 话题标签区 -->
        <div class="tags-section">
            <div class="tags-row">
                {% for topic in topics %}
                <button type="button" class="tag-pill {% if editing_post and editing_post.topic and editing_post.topic.id == topic.id %}active{% endif %}" onclick="selectTopic(this, {{ topic.id }})">
                    {{ topic.name }}
                </button>
                {% endfor %}
            </div>
            <input type="hidden" id="topic" name="topic" value="{% if editing_post and editing_post.topic %}{{ editing_post.topic.id }}{% endif %}">
            
            <div class="tag-input-row" style="margin-top: 1rem;">
                <input type="text" class="tag-input" id="tags" name="tags" placeholder="# 自定义标签">
                <button type="button" class="add-tag-btn">添加</button>
            </div>
        </div>
        
        <!-- 选项区 -->
        <div class="options-section">
            <!-- 标记地点 -->
            <div class="option-item" onclick="toggleLocation()">
                <div class="option-left">
                    <div class="option-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <span class="option-text" id="locationText">标记地点</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <span id="locationValue" style="color: rgba(232, 213, 155, 0.4); font-size: 0.85rem;"></span>
                    <i class="fas fa-chevron-right option-arrow"></i>
                </div>
            </div>
            
            <!-- 地点输入框（默认隐藏） -->
            <div id="locationInput" style="display: none; padding: 1rem 0 1rem 4rem;">
                <input type="text" name="location" class="location-input" placeholder="请输入地点..." style="width: 100%; padding: 0.6rem 1rem; background: rgba(20, 22, 30, 0.4); border: none; border-radius: 0.5rem; color: #F5EDC8; font-size: 0.9rem; outline: none;">
            </div>
            
            <!-- 公开可见 -->
            <div class="option-item" onclick="toggleVisibility()">
                <div class="option-left">
                    <div class="option-icon">
                        <i class="fas fa-eye" id="visibilityIcon"></i>
                    </div>
                    <span class="option-text" id="visibilityText">公开可见</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <span id="visibilityValue" style="color: rgba(232, 213, 155, 0.4); font-size: 0.85rem;"></span>
                    <i class="fas fa-chevron-right option-arrow"></i>
                </div>
            </div>
            <input type="hidden" name="visibility" id="visibilityInput" value="public">
            
            <!-- 高级选项 -->
            <div class="option-item" onclick="toggleAdvanced()">
                <div class="option-left">
                    <div class="option-icon">
                        <i class="fas fa-sliders-h"></i>
                    </div>
                    <span class="option-text">高级选项</span>
                </div>
                <i class="fas fa-chevron-down option-arrow" id="advancedArrow"></i>
            </div>
            
            <!-- 高级选项内容（默认隐藏） -->
            <div id="advancedOptions" style="display: none; padding: 1rem 0 1rem 4rem; border-bottom: 1px solid rgba(216, 191, 100, 0.1);">
                <label style="display: flex; align-items: center; padding: 0.5rem 0; cursor: pointer;">
                    <input type="checkbox" name="allow_comment" checked style="margin-right: 0.5rem; width: 16px; height: 16px;">
                    <span style="color: rgba(232, 213, 155, 0.6); font-size: 0.85rem;">允许评论</span>
                </label>
                <label style="display: flex; align-items: center; padding: 0.5rem 0; cursor: pointer;">
                    <input type="checkbox" name="is_top" style="margin-right: 0.5rem; width: 16px; height: 16px;">
                    <span style="color: rgba(232, 213, 155, 0.6); font-size: 0.85rem;">置顶帖子</span>
                </label>
            </div>
        </div>
        
        <!-- 底部操作区 -->
        <div class="bottom-actions">
            <a href="{% url 'my_drafts' %}" class="btn-drafts-link">
                <i class="fas fa-file-alt"></i> 我的草稿
            </a>
            {% if is_draft %}
            <button type="submit" name="action" value="draft" class="btn-draft">更新草稿</button>
            <button type="submit" name="action" value="publish" class="btn-publish">发布帖子</button>
            {% else %}
            <button type="submit" name="action" value="draft" class="btn-draft">存草稿</button>
            <button type="submit" name="action" value="publish" class="btn-publish">发布帖子</button>
            {% endif %}
        </div>
    </form>
</div>

<script>
// 图片预览
document.getElementById('cover_image').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = `
                <div class="image-preview">
                    <img src="${e.target.result}" alt="预览">
                </div>
            `;
        };
        reader.readAsDataURL(file);
    }
});

// 选择话题
function selectTopic(element, topicId) {
    // 移除其他选中状态
    document.querySelectorAll('.tag-pill').forEach(tag => {
        tag.classList.remove('active');
    });
    
    // 选中当前话题
    element.classList.add('active');
    document.getElementById('topic').value = topicId;
}

// 标记地点 - 显示/隐藏输入框
function toggleLocation() {
    const locationInput = document.getElementById('locationInput');
    const locationValue = document.getElementById('locationValue');
    
    if (locationInput.style.display === 'none') {
        locationInput.style.display = 'block';
        locationInput.querySelector('input').focus();
    } else {
        locationInput.style.display = 'none';
        // 如果没有输入内容，清空显示
        if (!locationInput.querySelector('input').value) {
            locationValue.textContent = '';
        }
    }
}

// 监听地点输入框的值变化
window.addEventListener('DOMContentLoaded', function() {
    const locationInput = document.querySelector('#locationInput input');
    const locationValue = document.getElementById('locationValue');
    
    if (locationInput) {
        locationInput.addEventListener('input', function() {
            locationValue.textContent = this.value || '';
        });
    }
});

// 切换可见性
function toggleVisibility() {
    const visibilityInput = document.getElementById('visibilityInput');
    const visibilityText = document.getElementById('visibilityText');
    const visibilityIcon = document.getElementById('visibilityIcon');
    const visibilityValue = document.getElementById('visibilityValue');
    
    const options = [
        { value: 'public', text: '公开可见', icon: 'fa-eye' },
        { value: 'private', text: '仅自己可见', icon: 'fa-lock' },
        { value: 'friends', text: '好友可见', icon: 'fa-user-friends' }
    ];
    
    const currentIndex = options.findIndex(opt => opt.value === visibilityInput.value);
    const nextIndex = (currentIndex + 1) % options.length;
    const nextOption = options[nextIndex];
    
    visibilityInput.value = nextOption.value;
    visibilityText.textContent = nextOption.text;
    visibilityValue.textContent = nextOption.text;
    visibilityIcon.className = `fas ${nextOption.icon}`;
}

// 切换高级选项
function toggleAdvanced() {
    const advancedOptions = document.getElementById('advancedOptions');
    const advancedArrow = document.getElementById('advancedArrow');
    
    if (advancedOptions.style.display === 'none') {
        advancedOptions.style.display = 'block';
        advancedArrow.className = 'fas fa-chevron-up option-arrow';
    } else {
        advancedOptions.style.display = 'none';
        advancedArrow.className = 'fas fa-chevron-down option-arrow';
    }
}
</script>
{% endblock %}
