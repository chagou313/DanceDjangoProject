{% extends 'dance/base.html' %}

{% block title %}发布帖子 - 交流社区{% endblock %}

{% block content %}
<style>
    .form-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 3rem 2rem;
    }

    .form-card {
        background: linear-gradient(135deg, rgba(20, 22, 30, 0.9) 0%, rgba(28, 30, 38, 0.95) 100%);
        border-radius: 2rem;
        padding: 3rem;
        border: 2px solid rgba(216, 191, 100, 0.4);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .form-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .form-title {
        font-size: 2.2rem;
        color: #F5EDC8;
        font-family: 'Noto Serif SC', serif;
        letter-spacing: 3px;
        margin-bottom: 0.5rem;
    }

    .form-subtitle {
        font-size: 1rem;
        color: rgba(232, 213, 155, 0.7);
    }

    .form-group {
        margin-bottom: 2rem;
    }

    .form-group label {
        display: block;
        font-size: 1rem;
        font-weight: 600;
        color: #E8D59B;
        font-family: 'Noto Serif SC', serif;
        margin-bottom: 0.8rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
        width: 100%;
        padding: 1rem 1.5rem;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(216, 191, 100, 0.4);
        border-radius: 1rem;
        color: #F5EDC8;
        font-family: 'Noto Serif SC', serif;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
        border-color: #D8BF64;
        box-shadow: 0 0 0 3px rgba(216, 191, 100, 0.2);
    }

    .form-group textarea {
        min-height: 300px;
        resize: vertical;
        line-height: 1.6;
    }

    .form-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 3rem;
    }

    .btn-submit {
        padding: 1rem 3rem;
        background: linear-gradient(135deg, #D8BF64 0%, #E8D59B 100%);
        border: none;
        border-radius: 2rem;
        color: #0F0F1A;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.4s;
        font-family: 'Noto Serif SC', serif;
        letter-spacing: 2px;
    }

    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(216, 191, 100, 0.6);
    }

    .btn-cancel {
        padding: 1rem 3rem;
        background: transparent;
        border: 2px solid rgba(216, 191, 100, 0.4);
        color: #E8D59B;
        border-radius: 2rem;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        font-family: 'Noto Serif SC', serif;
        text-decoration: none;
        display: inline-block;
    }

    .btn-cancel:hover {
        background: rgba(216, 191, 100, 0.15);
        border-color: rgba(216, 191, 100, 0.7);
    }

    @media (max-width: 768px) {
        .form-card {
            padding: 2rem 1.5rem;
        }

        .form-actions {
            flex-direction: column;
        }

        .btn-submit,
        .btn-cancel {
            width: 100%;
        }
    }
</style>

<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h1 class="form-title"><i class="fas fa-pen-fancy"></i> 发布新帖子</h1>
            <p class="form-subtitle">分享你的舞蹈心得与见解</p>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="title"><i class="fas fa-heading"></i> 标题</label>
                <input type="text" id="title" name="title" required placeholder="请输入帖子标题（最多 200 字）">
            </div>

            <div class="form-group">
                <label for="topic"><i class="fas fa-tag"></i> 话题</label>
                <select id="topic" name="topic" required>
                    <option value="">选择话题（必填）</option>
                    {% for topic in topics %}
                    <option value="{{ topic.id }}" style="color: {{ topic.color }};">{{ topic.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="tags"><i class="fas fa-tags"></i> 标签</label>
                <input type="text" id="tags" name="tags" placeholder="输入标签，多个标签用逗号分隔">
            </div>

            <div class="form-group">
                <label for="cover_image"><i class="fas fa-image"></i> 封面图片</label>
                <input type="file" id="cover_image" name="cover_image" accept="image/*">
            </div>

            <div class="form-group">
                <label for="content"><i class="fas fa-align-left"></i> 正文内容</label>
                <textarea id="content" name="content" required placeholder="请详细描述你想分享的内容..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> 立即发布
                </button>
                <a href="{% url 'community_posts' %}" class="btn-cancel">
                    <i class="fas fa-times"></i> 取消
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
