{% extends 'dance/base.html' %}

{% block title %}{{ level.name }} - 答题闯关{% endblock %}

{% block content %}
<style>
    .game-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
    }

    .game-header {
        background: linear-gradient(135deg, rgba(20, 22, 30, 0.9) 0%, rgba(28, 30, 38, 0.95) 100%);
        border-radius: 1.5rem;
        padding: 2rem;
        margin-bottom: 2rem;
        border: 2px solid rgba(216, 191, 100, 0.3);
    }

    .level-title {
        font-size: 1.8rem;
        color: #F5EDC8;
        font-family: 'Noto Serif SC', serif;
        margin-bottom: 1rem;
    }

    .progress-bar {
        width: 100%;
        height: 8px;
        background: rgba(216, 191, 100, 0.1);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 1rem;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #DAA520, #FFD700);
        transition: width 0.3s;
        border-radius: 4px;
    }

    .progress-text {
        display: flex;
        justify-content: space-between;
        color: rgba(232, 213, 155, 0.7);
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }

    .timer {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #D8BF64;
        font-size: 1.1rem;
        font-weight: bold;
    }

    .timer.warning {
        color: #E57373;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    .question-card {
        background: linear-gradient(135deg, rgba(20, 22, 30, 0.9) 0%, rgba(28, 30, 38, 0.95) 100%);
        border-radius: 1.5rem;
        padding: 2.5rem;
        border: 2px solid rgba(216, 191, 100, 0.3);
        margin-bottom: 2rem;
    }

    .question-type {
        display: inline-block;
        padding: 0.3rem 0.8rem;
        background: rgba(216, 191, 100, 0.1);
        border: 1px solid rgba(216, 191, 100, 0.3);
        border-radius: 1rem;
        color: #D8BF64;
        font-size: 0.85rem;
        margin-bottom: 1rem;
    }

    .question-content {
        font-size: 1.3rem;
        color: #F5EDC8;
        line-height: 1.8;
        margin-bottom: 2rem;
        font-family: 'Noto Serif SC', serif;
    }

    .options-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .option-item {
        padding: 1.2rem 1.5rem;
        background: rgba(216, 191, 100, 0.05);
        border: 2px solid rgba(216, 191, 100, 0.2);
        border-radius: 1rem;
        color: #E8D59B;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 1.05rem;
    }

    .option-item:hover {
        border-color: rgba(216, 191, 100, 0.5);
        background: rgba(216, 191, 100, 0.1);
    }

    .option-item.selected {
        border-color: #DAA520;
        background: rgba(218, 165, 32, 0.2);
    }

    .option-item.correct {
        border-color: #4CAF50;
        background: rgba(76, 175, 80, 0.2);
        color: #81C784;
    }

    .option-item.wrong {
        border-color: #F44336;
        background: rgba(244, 67, 54, 0.2);
        color: #E57373;
    }

    .submit-btn {
        width: 100%;
        padding: 1.2rem;
        background: linear-gradient(135deg, #DAA520, #B8860B);
        border: none;
        border-radius: 1rem;
        color: #FFD700;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(218, 165, 32, 0.4);
        margin-top: 2rem;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(218, 165, 32, 0.6);
    }

    .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .result-popup {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .result-popup.active {
        display: flex;
    }

    .result-content {
        background: linear-gradient(135deg, rgba(20, 22, 30, 0.98) 0%, rgba(28, 30, 38, 0.98) 100%);
        border-radius: 2rem;
        padding: 3rem;
        max-width: 600px;
        width: 90%;
        border: 2px solid rgba(216, 191, 100, 0.6);
        text-align: center;
    }

    .result-icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
    }

    .result-icon.correct {
        color: #81C784;
    }

    .result-icon.wrong {
        color: #E57373;
    }

    .result-title {
        font-size: 1.8rem;
        color: #F5EDC8;
        margin-bottom: 1rem;
        font-family: 'Noto Serif SC', serif;
    }

    .result-message {
        color: rgba(232, 213, 155, 0.7);
        font-size: 1.1rem;
        margin-bottom: 2rem;
        line-height: 1.6;
    }

    .result-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
    }

    .result-btn {
        padding: 1rem 2rem;
        border-radius: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
    }

    .result-btn.primary {
        background: linear-gradient(135deg, #DAA520, #B8860B);
        border: none;
        color: #FFD700;
    }

    .result-btn.secondary {
        background: transparent;
        border: 2px solid rgba(216, 191, 100, 0.4);
        color: #E8D59B;
    }

    .result-btn:hover {
        transform: translateY(-2px);
    }

    .loading {
        text-align: center;
        padding: 4rem;
        color: rgba(232, 213, 155, 0.6);
    }

    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(216, 191, 100, 0.2);
        border-top-color: #DAA520;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>

<div class="game-container">
    <div class="game-header">
        <h2 class="level-title"><i class="fas {{ level.icon }}"></i> {{ level.name }}</h2>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="progress-text">
            <span>进度: <span id="currentNum">0</span> / <span id="totalNum">{{ level.question_count }}</span></span>
            <div class="timer" id="timer">
                <i class="fas fa-clock"></i>
                <span id="timeDisplay">{{ level.time_limit }}</span>秒
            </div>
        </div>
    </div>

    <div id="questionContainer">
        <div class="loading">
            <div class="loading-spinner"></div>
            <div>正在加载题目...</div>
        </div>
    </div>
</div>

<!-- 结果弹窗 -->
<div class="result-popup" id="resultPopup">
    <div class="result-content">
        <div class="result-icon" id="resultIcon"></div>
        <h3 class="result-title" id="resultTitle"></h3>
        <p class="result-message" id="resultMessage"></p>
        <div class="result-actions" id="resultActions"></div>
    </div>
</div>

<script>
let quizRecordId = null;
let currentQuestion = null;
let selectedAnswer = null;
let timeLeft = {{ level.time_limit }};
let timerInterval = null;

// 页面加载时开始答题
document.addEventListener('DOMContentLoaded', function() {
    startQuiz();
});

function startQuiz() {
    fetch(`/quiz/api/start/{{ level.id }}/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json',
        },
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            quizRecordId = data.quiz_record_id;
            currentQuestion = data.question;
            timeLeft = data.time_limit;
            renderQuestion(currentQuestion);
            startTimer();
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('加载失败，请重试');
    });
}

function renderQuestion(question) {
    const container = document.getElementById('questionContainer');
    
    // 更新进度
    document.getElementById('currentNum').textContent = question.current_index + 1;
    const progress = ((question.current_index + 1) / question.total_questions) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    
    let html = `
        <div class="question-card">
            <span class="question-type">${question.type === 'choice' ? '单选题' : question.type === 'judge' ? '判断题' : '多选题'}</span>
            <div class="question-content">${question.content}</div>
            <div class="options-list">
    `;
    
    if (question.type === 'choice' || question.type === 'multi') {
        question.options.forEach((option, index) => {
            const label = String.fromCharCode(65 + index);
            html += `
                <div class="option-item" data-answer="${label}" onclick="selectOption(this)">
                    <strong>${label}.</strong> ${option}
                </div>
            `;
        });
    } else if (question.type === 'judge') {
        html += `
            <div class="option-item" data-answer="正确" onclick="selectOption(this)">
                <strong>A.</strong> 正确
            </div>
            <div class="option-item" data-answer="错误" onclick="selectOption(this)">
                <strong>B.</strong> 错误
            </div>
        `;
    }
    
    html += `
            </div>
            <button class="submit-btn" id="submitBtn" onclick="submitAnswer()" disabled>
                <i class="fas fa-check"></i> 提交答案
            </button>
        </div>
    `;
    
    container.innerHTML = html;
    selectedAnswer = null;
}

function selectOption(element) {
    // 移除其他选中状态
    document.querySelectorAll('.option-item').forEach(item => {
        item.classList.remove('selected');
    });
    
    // 添加选中状态
    element.classList.add('selected');
    selectedAnswer = element.dataset.answer;
    
    // 启用提交按钮
    document.getElementById('submitBtn').disabled = false;
}

function submitAnswer() {
    if (!selectedAnswer) return;
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';
    
    fetch('/quiz/api/submit/', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            quiz_record_id: quizRecordId,
            answer: selectedAnswer,
            time_spent: {{ level.time_limit }} - timeLeft,
        }),
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            if (data.completed) {
                // 答题完成
                showFinalResult(data.quiz_record);
            } else {
                // 显示对错结果
                showAnswerResult(data);
            }
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('提交失败，请重试');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-check"></i> 提交答案';
    });
}

function showAnswerResult(data) {
    const popup = document.getElementById('resultPopup');
    const icon = document.getElementById('resultIcon');
    const title = document.getElementById('resultTitle');
    const message = document.getElementById('resultMessage');
    const actions = document.getElementById('resultActions');
    
    if (data.is_correct) {
        icon.className = 'result-icon correct';
        icon.innerHTML = '<i class="fas fa-check-circle"></i>';
        title.textContent = '回答正确！';
        message.textContent = '太棒了！继续保持！';
        
        actions.innerHTML = `
            <button class="result-btn primary" onclick="nextQuestion()">
                <i class="fas fa-arrow-right"></i> 下一题
            </button>
        `;
        
        // 答对：可以显示延伸知识点推荐
        if (data.extension_knowledge_points && data.extension_knowledge_points.length > 0) {
            message.innerHTML += '<br><br><strong style="color: #81C784;">延伸学习：</strong><br>' + 
                data.extension_knowledge_points.map(kp => `• ${kp.name}`).join('<br>');
        }
    } else {
        icon.className = 'result-icon wrong';
        icon.innerHTML = '<i class="fas fa-times-circle"></i>';
        title.textContent = '回答错误';
        
        let wrongInfo = data.wrong_answer_info;
        message.innerHTML = `
            <strong>解析：</strong>${wrongInfo.explanation}<br><br>
            <strong>相关舞蹈：</strong>${wrongInfo.dance_project_name || '未知'}<br>
            <strong>知识点：</strong>${wrongInfo.knowledge_point}
        `;
        
        actions.innerHTML = `
            <a href="/origin/${wrongInfo.dance_project_id}/?back_to_quiz={{ level.id }}" class="result-btn secondary">
                <i class="fas fa-book"></i> 学习相关内容
            </a>
            <button class="result-btn primary" onclick="nextQuestion()">
                <i class="fas fa-arrow-right"></i> 下一题
            </button>
        `;
    }
    
    popup.classList.add('active');
}

function nextQuestion() {
    const popup = document.getElementById('resultPopup');
    popup.classList.remove('active');
    
    // 请求下一题
    fetch(`/quiz/api/start/{{ level.id }}/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json',
        },
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            currentQuestion = data.question;
            renderQuestion(currentQuestion);
        }
    });
}

function showFinalResult(record) {
    clearInterval(timerInterval);
    
    const popup = document.getElementById('resultPopup');
    const icon = document.getElementById('resultIcon');
    const title = document.getElementById('resultTitle');
    const message = document.getElementById('resultMessage');
    const actions = document.getElementById('resultActions');
    
    if (record.is_passed) {
        icon.className = 'result-icon correct';
        icon.innerHTML = '<i class="fas fa-trophy"></i>';
        title.textContent = '闯关成功！';
        message.innerHTML = `
            <strong>得分：</strong>${record.score}分<br>
            <strong>答对：</strong>${record.correct_answers}题<br>
            <strong>答错：</strong>${record.wrong_answers}题
        `;
    } else {
        icon.className = 'result-icon wrong';
        icon.innerHTML = '<i class="fas fa-times-circle"></i>';
        title.textContent = '闯关失败';
        message.innerHTML = `
            <strong>得分：</strong>${record.score}分<br>
            <strong>答对：</strong>${record.correct_answers}题<br>
            <strong>答错：</strong>${record.wrong_answers}题<br><br>
            需要 ${record.score >= 60 ? '继续努力！' : '再加油！'}
        `;
    }
    
    actions.innerHTML = `
        <a href="/quiz/" class="result-btn secondary">
            <i class="fas fa-th-list"></i> 返回关卡
        </a>
        <a href="/quiz/progress/" class="result-btn primary">
            <i class="fas fa-chart-line"></i> 查看进度
        </a>
    `;
    
    popup.classList.add('active');
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timeDisplay').textContent = timeLeft;
        
        if (timeLeft <= 30) {
            document.getElementById('timer').classList.add('warning');
        }
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert('时间到！');
            // 可以自动提交或结束答题
        }
    }, 1000);
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
