{% extends 'dance/base.html' %}

{% block title %}知识图谱 - 非遗传统舞蹈学习交流平台{% endblock %}

{% block content %}
<style>
    .page-header {
        text-align: center;
        padding: 3rem 2rem;
        background: linear-gradient(135deg, rgba(20, 22, 30, 0.9) 0%, rgba(28, 30, 38, 0.95) 100%);
        border-radius: 2rem;
        margin-bottom: 3rem;
        border: 2px solid rgba(216, 191, 100, 0.4);
    }

    .page-header h1 {
        font-size: 2.5rem;
        color: #F5EDC8;
        font-family: 'Noto Serif SC', serif;
        letter-spacing: 3px;
    }

    .coming-soon {
        text-align: center;
        padding: 5rem 2rem;
        background: rgba(216, 191, 100, 0.05);
        border-radius: 2rem;
        border: 2px solid rgba(216, 191, 100, 0.3);
        max-width: 800px;
        margin: 0 auto;
    }

    .coming-soon i {
        font-size: 5rem;
        color: #D8BF64;
        margin-bottom: 2rem;
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
    }

    .coming-soon h2 {
        font-size: 2rem;
        color: #F5EDC8;
        margin-bottom: 1rem;
    }

    .coming-soon p {
        font-size: 1.1rem;
        color: rgba(232, 213, 155, 0.7);
        line-height: 1.8;
    }
</style>

<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-brain"></i> 知识图谱</h1>
        <p>构建非遗舞蹈知识体系 · 系统化学习传承</p>
    </div>

    <div class="coming-soon">
        <i class="fas fa-sitemap"></i>
        <h2>功能即将上线</h2>
        <p>我们正在努力构建非遗舞蹈知识图谱，帮助您系统化地了解和学习传统舞蹈文化。</p>
        <p style="margin-top: 2rem; font-size: 0.95rem;">敬请期待...</p>
    </div>
</div>
{% endblock %}
