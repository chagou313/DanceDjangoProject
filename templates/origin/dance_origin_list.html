<script>
// 页面初始化
console.log('舞蹈起源页面已加载');
console.log('总项目数:', {{ total_results|default:0 }});

// 初始化地图
let map;
let markers = [];

// 从后端获取地区数据
const regionsData = {{ regions_data|safe }};
console.log('原始地区数据:', regionsData);

// 获取所有地区的完整项目数据
const allRegionData = {{ region_data|safe }};
window.allRegionData = allRegionData;
console.log('所有地区完整数据:', allRegionData);
console.log('地区键名:', Object.keys(allRegionData));

// 调试：打印每个地区的数据
for (const [key, value] of Object.entries(allRegionData)) {
    console.log(`地区：${key}, 项目数：${value.count}`);
}

// 中国主要地区的坐标（近似中心点）
const regionCoordinates = {
    '北京市': [116.405285, 39.904989],
    '天津市': [117.200983, 39.084158],
    '上海市': [121.473701, 31.230416],
    '重庆市': [106.551556, 29.563009],
    '河北省': [114.514867, 38.042307],
    '山西省': [112.562939, 37.870553],
    '辽宁省': [123.431474, 41.805698],
    '吉林省': [125.3245, 43.886841],
    '黑龙江省': [126.534967, 45.803775],
    '江苏省': [118.796877, 32.060255],
    '浙江省': [120.15507, 30.274084],
    '安徽省': [117.227239, 31.820586],
    '福建省': [119.296529, 26.074508],
    '江西省': [115.857967, 28.682892],
    '山东省': [117.000923, 36.675807],
    '河南省': [113.614034, 33.881839],
    '湖北省': [114.341481, 30.544332],
    '湖南省': [112.938814, 28.228209],
    '广东省': [113.266525, 23.132191],
    '海南省': [110.33119, 19.195949],
    '四川省': [104.066541, 30.572269],
    '贵州省': [106.874825, 26.815424],
    '云南省': [102.712251, 25.040609],
    '陕西省': [108.93977, 34.341574],
    '甘肃省': [103.8343, 36.061089],
    '青海省': [101.778237, 36.617144],
    '内蒙古自治区': [111.75196, 40.841407],
    '广西壮族自治区': [108.36654, 22.817002],
    '西藏自治区': [91.140856, 29.645554],
    '宁夏回族自治区': [106.230909, 38.487193],
    '新疆维吾尔自治区': [87.6168, 43.825592],
};

// 初始化地图函数
function initMap() {
    // 创建地图实例
    map = new AMap.Map('dance-map', {
        zoom: 4,
        center: [104.195398, 35.86166], // 中国中心点
        viewMode: '2D',
        mapStyle: 'amap://styles/darkblue' // 暗色主题
    });

    // 添加热力图
    if (regionsData && regionsData.length > 0) {
        addHeatmap(regionsData);
        updateStats(regionsData.length);
    }
}

// 添加热力图（使用圆形标记模拟）
function addHeatmap(regionsData) {
    console.log('开始添加热力图，数据量:', regionsData.length);
    let maxCount = 0;
    
    // 先找出最大值
    regionsData.forEach(region => {
        if (region.count > maxCount) {
            maxCount = region.count;
        }
    });
    
    console.log('最大值:', maxCount);
    
    // 为每个地区添加圆形标记
    regionsData.forEach(region => {
        const coords = regionCoordinates[region.name];
        if (coords) {
            // 计算颜色（根据数量）
            const ratio = region.count / maxCount;
            let color;
            if (ratio > 0.8) color = 'rgba(255, 215, 0, 0.8)';
            else if (ratio > 0.6) color = 'rgba(218, 165, 32, 0.7)';
            else if (ratio > 0.4) color = 'rgba(184, 134, 11, 0.6)';
            else if (ratio > 0.2) color = 'rgba(26, 26, 46, 0.5)';
            else color = 'rgba(13, 27, 42, 0.3)';
            
            // 创建圆形标记
            const circle = new AMap.Circle({
                center: new AMap.LngLat(coords[0], coords[1]),
                radius: 40000 + (region.count / maxCount) * 60000,
                fillColor: color,
                strokeColor: 'rgba(218, 165, 32, 0.6)',
                fillOpacity: 0.6,
                strokeWeight: 2,
                strokeOpacity: 0.8,
                cursor: 'pointer',
                extData: {
                    name: region.name,
                    count: region.count,
                    maxCount: maxCount
                }
            });
            
            circle.setMap(map);
            markers.push(circle);
            
            // 鼠标悬停事件 - 高亮圆圈
            circle.on('mouseover', function(e) {
                circle.setOptions({ 
                    fillColor: 'rgba(255, 215, 0, 0.9)',
                    fillOpacity: 0.8
                });
            });
            
            circle.on('mouseout', function(e) {
                circle.setOptions({ 
                    fillColor: color,
                    fillOpacity: 0.6
                });
            });
            
            // 点击事件 - 显示指标卡
            circle.on('click', function(e) {
                showIndicatorCard(region.name, region.count, maxCount, e.lnglat);
            });
        }
    });
    
    console.log('热力图圆形标记添加完成');
}

// 跳转函数（全局）
window.jumpToRegion = function(regionName) {
    // 解码地区名称（因为可能被 encodeURIComponent 编码）
    const decodedRegionName = decodeURIComponent(regionName);
    console.log('跳转函数接收到的地区:', regionName);
    console.log('解码后的地区:', decodedRegionName);
    // 在地图下方显示项目列表
    showProjectsBelowMap(decodedRegionName);
}

// 显示指标卡
let currentCard = null;
function showIndicatorCard(name, count, maxCount, position) {
    // 计算强度等级（1-5 星）
    const ratio = count / maxCount;
    let stars = '★'.repeat(Math.ceil(ratio * 5)) + '☆'.repeat(5 - Math.ceil(ratio * 5));
    
    const content = `
        <div style="
            padding: 15px 20px;
            background: linear-gradient(135deg, rgba(20, 22, 30, 0.98), rgba(28, 30, 38, 0.98));
            border: 2px solid rgba(216, 191, 100, 0.8);
            border-radius: 12px;
            min-width: 220px;
            box-shadow: 0 8px 30px rgba(218, 165, 32, 0.3);
            position: relative;
        ">
            <button onclick="closeIndicatorCard()" style="
                position: absolute;
                top: 8px;
                right: 8px;
                background: transparent;
                border: none;
                color: rgba(232, 213, 155, 0.6);
                font-size: 20px;
                cursor: pointer;
                padding: 0;
                width: 24px;
                height: 24px;
                line-height: 1;
            " onmouseover="this.style.color='#FFD700'" onmouseout="this.style.color='rgba(232, 213, 155, 0.6)'">
                ×
            </button>
            
            <h4 style="
                color: #F5EDC8;
                margin: 0 0 10px 0;
                font-size: 16px;
                font-weight: bold;
                font-family: 'Noto Serif SC', serif;
            ">${name}</h4>
            
            <div style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
            ">
                <span style="color: rgba(232, 213, 155, 0.8); font-size: 13px;">舞蹈项目</span>
                <span style="color: #FFD700; font-size: 20px; font-weight: bold;">${count}个</span>
            </div>
            
            <div style="
                color: #DAA520;
                font-size: 14px;
                margin-bottom: 15px;
                letter-spacing: 2px;
            ">${stars}</div>
            
            <button onclick="jumpToRegion('${encodeURIComponent(name)}')" style="
                width: 100%;
                padding: 8px 0;
                background: linear-gradient(135deg, #DAA520, #B8860B);
                border: none;
                border-radius: 6px;
                color: #FFD700;
                font-weight: bold;
                font-size: 14px;
                font-family: 'Noto Serif SC', serif;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(218, 165, 32, 0.4);
                transition: all 0.3s;
            " onmouseover="this.style.boxShadow='0 6px 20px rgba(218, 165, 32, 0.6)'; this.style.transform='translateY(-2px)';" 
               onmouseout="this.style.boxShadow='0 4px 15px rgba(218, 165, 32, 0.4)'; this.style.transform='translateY(0)';">
                查看详情
            </button>
        </div>
    `;
    
    currentCard = new AMap.InfoWindow({
        content: content,
        offset: new AMap.Pixel(0, -20),
        closeWhenClickMap: true,
        autoMove: true,
        isCustom: true  // 使用自定义样式，移除默认白色边框
    });
    
    currentCard.open(map, position);
}

// 隐藏指标卡
function hideIndicatorCard() {
    if (currentCard) {
        currentCard.close();
        currentCard = null;
    }
}

// 关闭指标卡（全局函数）
window.closeIndicatorCard = function() {
    hideIndicatorCard();
}

// 在地图下方显示指定地区的项目列表
function showProjectsBelowMap(regionName) {
    console.log('在地图下方显示地区项目:', regionName);
    
    // 关闭指标卡
    hideIndicatorCard();
    
    // 获取该地区的完整项目数据
    const regionFullData = window.allRegionData[regionName];
    
    console.log('regionFullData:', regionFullData);
    
    // 获取或创建显示容器
    let container = document.getElementById('region-projects-container');
    if (!container) {
        container = document.createElement('div');
        container.id = 'region-projects-container';
        container.style.cssText = `
            margin-top: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(20, 22, 30, 0.95) 0%, rgba(28, 30, 38, 0.98) 100%);
            border-radius: 2rem;
            border: 2px solid rgba(216, 191, 100, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        `;
        
        // 插入到地图容器后面
        const mapContainer = document.querySelector('.map-section');
        mapContainer.parentNode.insertBefore(container, mapContainer.nextSibling);
    }
    
    if (!regionFullData) {
        container.innerHTML = `
            <div style="text-align: center; padding: 3rem;">
                <div style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.5;">📭</div>
                <div style="font-size: 1.2rem; color: #E8D59B; margin-bottom: 0.5rem;">暂无项目</div>
                <div style="font-size: 0.9rem; color: rgba(232, 213, 155, 0.5);">该地区还没有舞蹈项目</div>
            </div>
        `;
        return;
    }
    
    const count = regionFullData.count || 0;
    const dances = regionFullData.dances || [];
    
    console.log('项目数量:', count, '项目列表:', dances.length);
    
    let content = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid rgba(216, 191, 100, 0.3);">
            <h3 style="color: #F5EDC8; font-size: 1.5rem; font-family: 'Noto Serif SC', serif; margin: 0;">
                <i class="fas fa-map-marker-alt"></i> ${regionName}
            </h3>
            <button onclick="closeRegionProjects()" style="
                background: transparent;
                border: 2px solid rgba(216, 191, 100, 0.4);
                border-radius: 1rem;
                color: rgba(232, 213, 155, 0.6);
                padding: 0.5rem 1.5rem;
                cursor: pointer;
                font-family: 'Noto Serif SC', serif;
                transition: all 0.3s;
            " onmouseover="this.style.borderColor='#D8BF64'; this.style.color='#F5EDC8'" 
               onmouseout="this.style.borderColor='rgba(216, 191, 100, 0.4)'; this.style.color='rgba(232, 213, 155, 0.6)'">
                <i class="fas fa-times"></i> 关闭
            </button>
        </div>
        <div style="color: #D8BF64; font-size: 1.1rem; margin-bottom: 1.5rem; font-weight: bold;">
            共 ${count} 个项目
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
    `;
    
    if (count === 0 || dances.length === 0) {
        content = `
            <div style="text-align: center; padding: 3rem;">
                <div style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.5;">📭</div>
                <div style="font-size: 1.2rem; color: #E8D59B; margin-bottom: 0.5rem;">暂无项目</div>
                <div style="font-size: 0.9rem; color: rgba(232, 213, 155, 0.5);">该地区还没有舞蹈项目</div>
            </div>
        `;
    } else {
        dances.forEach(project => {
            content += `
                <a href="/origin/${project.project_code}/" style="
                    display: block;
                    padding: 1.5rem;
                    background: rgba(10, 10, 15, 0.6);
                    border: 2px solid rgba(216, 191, 100, 0.3);
                    border-radius: 1.5rem;
                    color: #F5EDC8;
                    text-decoration: none;
                    transition: all 0.3s;
                " onmouseover="this.style.background='rgba(184, 134, 11, 0.2)'; this.style.borderColor='rgba(216, 191, 100, 0.6)'; this.style.transform='translateY(-5px)'" 
                   onmouseout="this.style.background='rgba(10, 10, 15, 0.6)'; this.style.borderColor='rgba(216, 191, 100, 0.3)'; this.style.transform='translateY(0)'">
                    <div style="font-size: 1.2rem; font-weight: bold; color: #FFD700; margin-bottom: 0.8rem;">${project.name}</div>
                    <div style="font-size: 0.9rem; color: rgba(232, 213, 155, 0.7); margin-bottom: 0.5rem;">
                        <span style="color: #D8BF64;">${project.dance_type || ''}</span>
                        ${project.category ? `<span style="margin-left: 0.5rem; color: rgba(232, 213, 155, 0.6);">· ${project.category}</span>` : ''}
                    </div>
                    ${project.level ? `<div style="font-size: 0.8rem; color: rgba(232, 213, 155, 0.5);">${project.level}</div>` : ''}
                </a>
            `;
        });
        content += '</div>';
    }
    
    container.innerHTML = content;
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// 关闭地区项目显示
window.closeRegionProjects = function() {
    const container = document.getElementById('region-projects-container');
    if (container) {
        container.remove();
    }
}

// 更新统计
function updateStats(regionCount) {
    document.getElementById('total-regions').textContent = regionCount;
}

// 页面加载完成后初始化地图
document.addEventListener('DOMContentLoaded', function() {
    // 检查高德地图是否已加载
    if (typeof AMap !== 'undefined') {
        initMap();
    } else {
        console.error('高德地图 API 未加载成功，请检查 Key 配置');
    }
});
</script>
{% endblock %}
