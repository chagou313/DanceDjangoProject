<!-- 测试页面 - 简单搜索 + 下拉框 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试 - 搜索框 + 下拉框</title>
    <style>
        body {
            background: #0A0A0F;
            color: #E8D59B;
            font-family: 'Noto Serif SC', serif;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: #D4AF37; margin-bottom: 2rem; }
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
        }
        .search-box {
            flex: 1;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 0.8rem 2.5rem 0.8rem 1rem;
            background: rgba(20, 22, 30, 0.9);
            border: 2px solid rgba(216, 191, 100, 0.3);
            border-radius: 0.5rem;
            color: #E8D59B;
            font-size: 1rem;
        }
        .search-input:focus {
            outline: none;
            border-color: rgba(216, 191, 100, 0.6);
        }
        .clear-btn {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(232, 213, 155, 0.5);
            font-size: 0.9rem;
            display: none;
        }
        .project-select {
            padding: 0.8rem 1rem;
            background: rgba(20, 22, 30, 0.9);
            border: 2px solid rgba(216, 191, 100, 0.3);
            border-radius: 0.5rem;
            color: #E8D59B;
            font-size: 1rem;
            min-width: 250px;
            cursor: pointer;
        }
        .project-select:focus {
            outline: none;
            border-color: rgba(216, 191, 100, 0.6);
        }
        .project-select option {
            background: #14161E;
            color: #E8D59B;
        }
        .results {
            background: rgba(20, 22, 30, 0.95);
            border: 2px solid rgba(216, 191, 100, 0.3);
            border-radius: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 0.5rem;
            display: none;
        }
        .result-item {
            padding: 0.8rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(216, 191, 100, 0.1);
        }
        .result-item:hover {
            background: rgba(216, 191, 100, 0.15);
        }
        .result-item:last-child { border-bottom: none; }
        mark {
            background: rgba(216, 191, 100, 0.3);
            color: #FFD700;
            padding: 0.1rem 0.2rem;
            border-radius: 0.2rem;
        }
        .status {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(216, 191, 100, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(216, 191, 100, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>测试搜索 + 下拉框</h1>
        
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="输入关键词搜索...">
                <span class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</span>
            </div>
            <select id="projectSelect" class="project-select" onchange="selectProject(this.value)">
                <option value="">-- 选择项目 --</option>
            </select>
        </div>
        
        <div class="results" id="results"></div>
        
        <div class="status" id="status">等待操作...</div>
    </div>

    <script>
        // 项目数据
        const projects = [
            {id: 1, name: '藏族锅庄舞'},
            {id: 2, name: '蒙古族安代舞'},
            {id: 3, name: '维吾尔族赛乃姆'},
            {id: 4, name: '傣族孔雀舞'},
            {id: 5, name: '朝鲜族长鼓舞'},
            {id: 6, name: '彝族跳菜'},
            {id: 7, name: '苗族芦笙舞'},
            {id: 8, name: '壮族扁担舞'},
        ];
        
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const projectSelect = document.getElementById('projectSelect');
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        
        // 初始化下拉框
        projects.forEach(p => {
            const option = document.createElement('option');
            option.value = p.id;
            option.textContent = p.name;
            projectSelect.appendChild(option);
        });
        
        function showStatus(msg) {
            status.textContent = msg;
        }
        
        function highlightMatch(text, keyword) {
            if (!keyword) return text;
            const regex = new RegExp('(' + keyword + ')', 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }
        
        searchInput.addEventListener('input', function() {
            const keyword = this.value.trim();
            
            if (!keyword) {
                clearBtn.style.display = 'none';
                results.style.display = 'none';
                showStatus('请输入关键词搜索');
                return;
            }
            
            clearBtn.style.display = 'block';
            const filtered = projects.filter(p => 
                p.name.toLowerCase().includes(keyword.toLowerCase())
            );
            
            if (filtered.length === 0) {
                results.innerHTML = '<div class="result-item" style="text-align: center; color: rgba(232, 213, 155, 0.5);">没有找到匹配的项目</div>';
            } else {
                results.innerHTML = filtered.map(p => 
                    `<div class="result-item" onclick="selectProject(${p.id})">${highlightMatch(p.name, keyword)}</div>`
                ).join('');
            }
            results.style.display = 'block';
            showStatus(`找到 ${filtered.length} 个匹配项目`);
        });
        
        function clearSearch() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            results.style.display = 'none';
            projectSelect.value = '';
            showStatus('已清空搜索');
        }
        
        function selectProject(projectId) {
            if (!projectId) return;
            const project = projects.find(p => p.id === parseInt(projectId));
            if (project) {
                searchInput.value = project.name;
                clearBtn.style.display = 'block';
                results.style.display = 'none';
                projectSelect.value = projectId;
                showStatus(`已选择: ${project.name}`);
            }
        }
        
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box') && !e.target.closest('.results')) {
                results.style.display = 'none';
            }
        });
    </script>
</body>
</html>
